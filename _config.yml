      - layout: left
        border: weak
        title: "EVR: Eyesight-Only Visual Representation for Recognition without Language"
        link: /assets/EVR.pdf
        link_text: Paper
        additional_links:
          - title: Paper
            icon: fas fa-file-pdf
            url: /assets/EVR.pdf
          - title: arXiv
            icon: ai ai-arxiv
            url: https://arxiv.org/abs/
        quote: >
          Aug 2025 - Present, CCF-A In Submission
        description: | # this will include new lines to allow paragraphs
          Authors: *Rong Fu*, *Chunlei Meng*, ***Shuo Yin***, *Zijian Zhang*, *Weizhi Tang*, *Shaobo Wang*, *Youjin Wang*, *Simon James Fong*
          
          This research presents a vision-based approach that abandons text and allows visual features to communicate through a graph of image prototypes. Using self-supervised learning, the model uncovers emergent semantic structures, where meaning is determined purely by vision. Text is only used for interpretation, not during training. This method demonstrates that vision alone can recognize and name the world without relying on textual input.

          ![EVR Framework](assets/EVR.png)
      - layout: left
        border: weak
        title: "Revolutionizing Open Set Domain Generalization: Learning to generalize via Conditional Diffusion Without Gradient"
        link: /assets/OGDiff.pdf
        link_text: Paper
        additional_links:
          - title: Paper
            icon: fas fa-file-pdf
            url: /assets/OGDiff.pdf
          - title: arXiv
            icon: ai ai-arxiv
            url: https://arxiv.org/abs/
        quote: >
          Jul 2025 - Present, CCF-A In Submission
        description: | # this will include new lines to allow paragraphs
          Authors: *Haidong Kang*, ***Shuo Yin***, *Huiquan Zhang*
          
          This work introduces **OGDiff**, a novel OSDG framework that replaces expensive second-order meta-learning with a conditional diffusion process. This avoids inner-loop backpropagation, reducing computational costs and improving stability. The **MSDFF** module is also introduced to better capture both fine- and coarse-grained features, enhancing recognition of known and unknown classes. 

          ![OGDiff Framework](assets/OGDiff.png)
      - layout: left
