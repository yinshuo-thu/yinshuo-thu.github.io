          Authors: *Kaixiang Zhang*, *Haoran Zhang*, *Qi Lan*, *Zesen Chen*, ***Shuo Yin***, *Yongqi Wei*, *Zehao Wang*, *Jianlong Yang*
          
          This research presents a zero-shot OCT segmentation method that overcomes the limitations of traditional deep learning approaches, which require re-labeling and retraining for unseen Regions of Interest (ROIs). The method only needs box or point prompts for ROIs in the first frame, enabling automatic segmentation in subsequent frames.
          
