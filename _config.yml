  I am currently pursuing a Master's in Finance at Tsinghua University, after earning my Bachelor's in Engineering from Shanghai Jiao Tong University. My undergraduate studies spanned computer vision, NLP, and time series analysis, which now influence my work in quantitative modeling and factor discovery using deep learning.

  I am open to opportunities in Quantitative Research and welcome connections for collaboration or discussion. Feel free to reach out via WeChat (Elon\_Yin) or email at [yinelon@gmail.com](mailto:yinelon@gmail.com). For more details, you can download my bilingual resume [here](assets/Resume-ShuoYin-1108.pdf).


